<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
    <meta name="description" content="KingMaker, a table game from White Glove Games." />
    <title>KingMaker · White Glove Games</title>
    <link rel="manifest" href="/kingmaker/manifest.webmanifest" />
    <meta name="theme-color" content="#15171c" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #15171c; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #km-title { position: fixed; left: 16px; top: 12px; color: rgba(250, 248, 242, 0.7); font-size: 12px; pointer-events: none; }
      #km-status { position: fixed; left: 16px; right: 16px; bottom: max(24px, env(safe-area-inset-bottom, 0px)); text-align: center; color: rgba(250, 248, 242, 0.9); font-size: 15px; pointer-events: none; z-index: 30; transition: opacity 0.45s ease; }
      #km-status.km-fade { opacity: 0; }
      #km-status.error { pointer-events: auto; z-index: 910; }
      #km-progress { margin: 10px auto 0; width: min(72vw, 280px); }
      #km-progress-track { height: 6px; border-radius: 99px; background: rgba(250, 248, 242, 0.15); overflow: hidden; }
      #km-progress-fill { height: 100%; width: 0%; background: #e9c46a; border-radius: 99px; transition: width 0.2s ease-out; }
      #km-progress-meta { margin-top: 6px; font-size: 12px; opacity: 0.75; letter-spacing: 0.02em; display: flex; justify-content: center; gap: 8px; }
      @media (max-height: 500px) {
        #km-status { bottom: max(12px, env(safe-area-inset-bottom, 0px)); font-size: 14px; }
        #km-progress { width: min(64vw, 220px); margin-top: 8px; }
      }
    </style>
    <script type="module" crossorigin src="/kingmaker/assets/main-ChHg_lHB.js"></script>
    <link rel="modulepreload" crossorigin href="/kingmaker/assets/telemetry-C73Ws7zs.js">
  </head>
  <body>
    <div id="km-title">KingMaker · White Glove Games</div>
    <div id="km-status" aria-live="polite" aria-busy="true">
      <div id="km-status-line">Loading KingMaker…</div>
      <div id="km-progress">
        <div id="km-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0% Loading KingMaker…">
          <div id="km-progress-fill"></div>
        </div>
        <div id="km-progress-meta"><span id="km-progress-pct">0%</span><span id="km-progress-item"></span></div>
      </div>
    </div>
    <div id="wg-hud-root"></div>
  </body>
</html>
